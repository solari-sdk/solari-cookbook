name: SAST

# Modelled on pinetree-desktop's sast.yml, which passes Secureframe's
# "Code static application security testing" check. Deliberately the same
# shape rather than a clean-room workflow: the compliance scanner is matching
# on something we cannot query per-repo, so a known-passing shape is the
# likelier fit.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-scan of the default branch. Compliance wants RECURRING evidence
    # even in a quiet week, not only push-triggered runs.
    - cron: "37 9 * * 1"

permissions:
  contents: read

concurrency:
  group: sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two steps, one real gate: "Report" is advisory and never blocks, so a reader
# sees untriaged WARNING/INFO findings too; "Gate" fails on ERROR only.
# This repo is example/tutorial code -- if the gate goes red on a registry
# update, triage it (fix, or suppress inline with a reason a reviewer sees in
# the diff) rather than loosening the gate.
jobs:
  semgrep:
    name: Semgrep (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: python -m pip install --quiet semgrep==1.172.0

      - name: Report (all severities, advisory)
        run: semgrep scan --config p/default --config p/secrets

      # EXCLUSIONS APPLY TO THE GATE ONLY, NOT THE REPORT ABOVE.
      # pinetree-desktop excludes these from both; keeping the report unfiltered
      # is deliberate here -- the findings stay visible to anyone reading the log,
      # and only the BLOCKING decision is narrowed. Hiding them from both would
      # make the report agree with the gate by construction, which is the
      # vacuous-pass shape.
      #
      # detect-insecure-websocket: both hits in this repo are inside PROSE
      #   COMMENTS explaining that `fetch` will not accept a ws:// URL and the
      #   scheme must be swapped. The rule is matching documentation about the
      #   hazard, not a websocket. Verified by reading the flagged lines
      #   (examples/*, lines 138 and 46), not inferred from the rule name.
      # python37-compatibility-importlib2: `from importlib.resources import
      #   files` -- a COMPATIBILITY warning about Python 3.7, not a security
      #   finding. This is a security gate; a back-compat note does not belong
      #   in it, and these examples target modern Python.
      #
      # If either genuinely fires on new code, the right move is to fix it or
      # suppress it inline with a reason a reviewer sees in the diff -- not to
      # widen this list.
      - name: Gate (ERROR severity blocks)
        run: >
          semgrep scan
          --config p/default
          --config p/secrets
          --severity ERROR
          --error
          --exclude-rule javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket
          --exclude-rule python.lang.compatibility.python37.python37-compatibility-importlib2
