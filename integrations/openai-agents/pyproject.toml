[project]
name = "solari-agents-sandbox"
version = "0.1.0"
description = "Solari microVM sandbox provider for the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.22",
    "solari-sandbox>=0.2.0",
]

[project.urls]
Homepage = "https://getsolari.com"
Documentation = "https://docs.getsolari.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solari_agents_sandbox"]
