services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      SOLARI_API_KEY: ${SOLARI_API_KEY:-}
    volumes:
      - solari-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready',timeout=3)); raise SystemExit(0 if d.get('status')=='ready' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  solari-data:
