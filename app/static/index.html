<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solari OSINT Operations Center</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">PUBLIC-SOURCE OPERATIONS</p>
      <h1>Solari OSINT Operations Center</h1>
    </div>
    <div id="health" class="status">Checking…</div>
  </header>

  <main>
    <section class="controls panel">
      <label>Source
        <select id="sourceFilter"><option value="">All</option></select>
      </label>
      <label>Category
        <select id="categoryFilter"><option value="">All</option></select>
      </label>
      <label>Limit
        <input id="limitFilter" type="number" min="1" max="1000" value="250">
      </label>
      <button id="refreshBtn">Refresh</button>
      <button id="collectBtn">Collect USGS now</button>
    </section>

    <section class="metrics">
      <article class="panel metric"><span>Events</span><strong id="eventCount">0</strong></article>
      <article class="panel metric"><span>Sources</span><strong id="sourceCount">0</strong></article>
      <article class="panel metric"><span>Latest event</span><strong id="latestEvent">—</strong></article>
      <article class="panel metric"><span>Data mode</span><strong>Public only</strong></article>
    </section>

    <section class="workspace">
      <div id="map" class="panel"></div>
      <aside class="panel event-panel">
        <div class="panel-title"><h2>Event stream</h2><span id="streamState"></span></div>
        <div id="events"></div>
      </aside>
    </section>

    <section class="panel evidence-panel">
      <div class="panel-title"><h2>Evidence / provenance</h2><span>Select an event</span></div>
      <pre id="evidence">No event selected.</pre>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
