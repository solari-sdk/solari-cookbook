# SPDX-License-Identifier: AGPL-3.0-only
[workspace]
resolver = "2"
members = ["crates/wsp-frames", "crates/wsp-runtime", "crates/wsp-daemon", "crates/wsp-guest", "crates/wsp-daemon-bin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "sync", "fs", "process"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect", "rustls-tls-webpki-roots"] }
# The provider rustls builds a client config from. tokio-tungstenite's feature turns none on, so without this the
# provider would come from whatever else in the tree happens to ask for one, and a wss dial would panic in
# ClientConfig::builder() the day that changes rather than fail to build.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
subtle = "2"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
# The serde attributes ts-rs cannot read here are the bounds a field is deserialized with and the finite reading a
# float is serialized with; each keeps the field's own type, so the warning it prints for every one says nothing.
ts-rs = { version = "12", features = ["no-serde-warnings"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
