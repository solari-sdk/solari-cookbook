# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "wsp-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The daemon server: the door every socket passes, and the op switch behind it"

[dependencies]
wsp-frames = { path = "../wsp-frames" }
wsp-runtime = { path = "../wsp-runtime" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
# The link's own key agreement and cipher; the same build rustls already pins, so the two never disagree.
ring = "0.17"
futures-util.workspace = true
subtle.workspace = true
base64.workspace = true
sha2 = "0.10"
portable-pty = "0.9"
nix = { version = "0.31", default-features = false, features = ["signal", "user", "feature", "fs"] }
ed25519-dalek = { version = "3", features = ["pem"] }
getrandom = "0.4"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
futures-util.workspace = true
