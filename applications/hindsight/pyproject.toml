[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight-solari"
version = "0.1.0"
description = "Checkpoint and rewind for coding agents on Solari sandboxes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "solari-sandbox>=0.2.0",
  "anthropic>=1.0",
]

[project.scripts]
hindsight = "hindsight.cli:main"

[tool.setuptools]
packages = ["hindsight"]
