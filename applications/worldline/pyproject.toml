[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "worldline-solari"
version = "0.1.0"
description = "Speculative execution and verified rollback for computer-use agents on Solari"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "solari-desktop>=0.2.0",
  "solari-sandbox>=0.2.0",
]

[project.scripts]
worldline = "worldline.cli:main"

[tool.setuptools]
packages = ["worldline"]

[tool.setuptools.package-data]
worldline = ["static/*"]
