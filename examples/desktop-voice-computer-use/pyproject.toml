[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solari-voice-agent"
version = "0.1.0"
description = "Voice-Directed Autonomous Computer-Use Agent using Solari Desktop SDK, LangGraph, Whisper, and Live War Room Observability"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Solari Voice Agent Builders" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "openai>=1.50.0",
    "pillow>=10.4.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "websockets>=13.0",
    "rich>=13.8.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]

[project.scripts]
solari-voice = "cli:main"
solari-warroom = "run_dashboard:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
